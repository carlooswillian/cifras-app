<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cifras Numbers - AI Powered</title>
    <style>
        /* === iOS DARK MODE CSS === */
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #ebebf599;
            --accent: #0a84ff;
            --accent-hover: #007aff;
            --border: #38383a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding-bottom: 80px; }
        
        header { background-color: rgba(28, 28, 30, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
        
        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { background-color: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        .song-list-item { border-bottom: 1px solid var(--border); padding: 12px 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .song-list-item:last-child { border-bottom: none; }
        .song-list-item h3 { font-size: 17px; margin-bottom: 4px; font-weight: 500; }
        .song-list-item p { font-size: 14px; color: var(--text-secondary); }
        
        input, textarea, select { width: 100%; background-color: #2c2c2e; border: none; border-radius: 10px; padding: 12px 16px; color: var(--text-primary); font-size: 16px; margin-bottom: 16px; outline: none; }
        textarea { resize: vertical; min-height: 200px; font-family: monospace; }
        
        button { background-color: var(--accent); color: white; border: none; border-radius: 10px; padding: 14px; font-size: 17px; font-weight: 600; width: 100%; cursor: pointer; transition: 0.2s; }
        button:disabled { opacity: 0.5; background-color: #0a84ff80; cursor: not-allowed; }
        button:active { transform: scale(0.98); }
        
        .section-title { font-size: 13px; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; margin-bottom: 8px; margin-top: 20px; letter-spacing: 0.5px; }
        
        /* Song View Styles */
        .song-header h2 { font-size: 28px; margin-bottom: 4px; }
        .song-header p { color: var(--text-secondary); margin-bottom: 16px; }
        
        .cifra-section { margin-bottom: 24px; }
        .cifra-section h4 { color: var(--text-primary); margin-bottom: 8px; font-size: 16px; font-weight: 600; }
        .cifra-section h4 span { color: var(--text-secondary); font-weight: 400; font-size: 14px; }
        
        /* Ajuste fino na fonte para acomodar as barras | e (2x) perfeitamente */
        .cifra-chords { font-family: "Courier New", Courier, monospace; font-size: 17px; line-height: 1.8; letter-spacing: 1px; color: var(--accent); font-weight: 700; white-space: pre-wrap; }
        
        .badge { display: inline-block; background-color: #2c2c2e; padding: 6px 12px; border-radius: 12px; font-size: 13px; font-weight: 500; margin-right: 8px; margin-bottom: 8px; }
        .badge.capo { background-color: rgba(10, 132, 255, 0.2); color: var(--accent); display: block; width: fit-content;}
        
        /* Navigation Bar Bottom */
        nav { position: fixed; bottom: 0; width: 100%; background-color: rgba(28, 28, 30, 0.9); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0 20px 0; }
        nav div { color: var(--text-secondary); font-size: 12px; text-align: center; cursor: pointer; width: 50%; }
        nav div.active { color: var(--accent); }
        nav div svg { display: block; margin: 0 auto 4px auto; width: 24px; height: 24px; fill: currentColor; }

        .hidden { display: none !important; }
        .loading { text-align: center; color: var(--text-secondary); padding: 40px; }
    </style>
</head>
<body>

    <header>
        <h1 id="header-title">Minhas Cifras</h1>
        <div id="btn-back" class="hidden" style="color: var(--accent); cursor: pointer; font-size: 16px;">Voltar</div>
    </header>

    <main id="view-list" class="container">
        <div id="loading-list" class="loading">Carregando músicas...</div>
        <div class="card hidden" id="song-list-container"></div>
    </main>

    <main id="view-add" class="container hidden">
        <div class="section-title">Adicionar Nova Cifra</div>
        <div class="card">
            <!-- Removido o campo de ritmo manual -->
            <textarea id="input-cifra" placeholder="Cole aqui o texto completo da cifra..."></textarea>
            <button id="btn-salvar" onclick="saveCifra()">Processar com IA e Salvar</button>
        </div>
    </main>

    <main id="view-song" class="container hidden">
        <div class="song-header">
            <h2 id="sv-title">• Título</h2>
            <p id="sv-artist">Artista</p>
            <div>
                <span class="badge" id="sv-key">Tom: E</span>
                <span class="badge" id="sv-rhythm">Ritmo: 4/4</span>
            </div>
        </div>

        <div class="section-title">Sugestões de Tons e Capotraste (IA)</div>
        <div class="card" id="sv-capo-suggestions"></div>

        <div class="section-title">Cifra Numérica (Roadmap)</div>
        <div class="card" id="sv-cifra-body"></div>
    </main>

    <nav>
        <div id="nav-list" class="active" onclick="switchView('list')">
            <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            Biblioteca
        </div>
        <div id="nav-add" onclick="switchView('add')">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Adicionar
        </div>
    </nav>

    <script>
        // === COLOQUE O SEU NOVO LINK DO DEPLOY AQUI ===
        const API_URL = 'COLOQUE_SEU_LINK_AQUI';

        let songsDatabase = [];

        window.onload = () => { fetchSongs(); };

        function switchView(view) {
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-add').classList.add('hidden');
            document.getElementById('view-song').classList.add('hidden');
            document.getElementById('btn-back').classList.add('hidden');
            
            document.getElementById('nav-list').classList.remove('active');
            document.getElementById('nav-add').classList.remove('active');

            if(view === 'list') {
                document.getElementById('view-list').classList.remove('hidden');
                document.getElementById('nav-list').classList.add('active');
                document.getElementById('header-title').innerText = 'Minhas Cifras';
                if(songsDatabase.length === 0) fetchSongs();
            } else if(view === 'add') {
                document.getElementById('view-add').classList.remove('hidden');
                document.getElementById('nav-add').classList.add('active');
                document.getElementById('header-title').innerText = 'Nova Cifra';
            } else if(view === 'song') {
                document.getElementById('view-song').classList.remove('hidden');
                document.getElementById('btn-back').classList.remove('hidden');
                document.getElementById('header-title').innerText = 'Cifra';
            }
        }

        document.getElementById('btn-back').onclick = () => switchView('list');

        async function fetchSongs() {
            try {
                const response = await fetch(API_URL);
                songsDatabase = await response.json();
                renderList();
            } catch (error) {
                console.error("Erro ao carregar", error);
                document.getElementById('loading-list').innerText = "Erro ao carregar dados.";
            }
        }

        async function saveCifra() {
            const rawText = document.getElementById('input-cifra').value;
            
            if(!rawText) return alert('Cole a cifra primeiro!');
            
            const btn = document.getElementById('btn-salvar');
            btn.innerText = 'Processando com IA (Aguarde...)';
            btn.disabled = true;

            try {
                // Agora enviamos apenas o texto bruto. Ritmo etc é inferido pela IA.
                const payload = { raw: rawText };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if(result.success) {
                    alert('Música convertida e salva com sucesso!');
                    document.getElementById('input-cifra').value = '';
                    await fetchSongs(); // Recarrega a biblioteca com a música nova
                    switchView('list');
                } else {
                    alert('Erro na conversão: ' + result.error);
                }
            } catch (e) {
                alert('Erro ao se conectar com o servidor.');
                console.error(e);
            } finally {
                btn.innerText = 'Processar com IA e Salvar';
                btn.disabled = false;
            }
        }

        function renderList() {
            const container = document.getElementById('song-list-container');
            const loading = document.getElementById('loading-list');
            
            loading.classList.add('hidden');
            container.classList.remove('hidden');
            container.innerHTML = '';

            if(songsDatabase.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:gray;">Nenhuma música salva ainda.</p>';
                return;
            }

            [...songsDatabase].reverse().forEach(song => {
                const div = document.createElement('div');
                div.className = 'song-list-item';
                div.innerHTML = `
                    <div>
                        <h3>${song.Title}</h3>
                        <p>${song.Artist}</p>
                    </div>
                    <div style="color: var(--accent); font-weight: bold;">${song.Key}</div>
                `;
                div.onclick = () => openSong(song);
                container.appendChild(div);
            });
        }

        function openSong(song) {
            document.getElementById('sv-title').innerText = `• ${song.Title}`;
            document.getElementById('sv-artist').innerText = song.Artist;
            document.getElementById('sv-key').innerText = `Tom: ${song.Key}`;
            
            // O Ritmo agora é populado com a resposta que a IA inferiu
            document.getElementById('sv-rhythm').innerText = `Ritmo: ${song.Rhythm || 'Não detectado'}`;

            const body = document.getElementById('sv-cifra-body');
            body.innerHTML = '';
            
            if(song.SectionsJSON) {
                song.SectionsJSON.forEach(section => {
                    const div = document.createElement('div');
                    div.className = 'cifra-section';
                    
                    let titleHtml = section.name;
                    if (section.lyric && section.lyric.trim() !== '') {
                        titleHtml += ` <span>(${section.lyric})</span>`;
                    }

                    div.innerHTML = `<h4>${titleHtml}</h4><div class="cifra-chords">${section.chords.join('<br>')}</div>`;
                    body.appendChild(div);
                });
            }

            // Exibe sugestões de Capo enviadas pela IA
            const capoContainer = document.getElementById('sv-capo-suggestions');
            capoContainer.innerHTML = '';
            
            if (song.CapoJSON && song.CapoJSON.length > 0) {
                song.CapoJSON.forEach(sugestao => {
                    capoContainer.innerHTML += `<span class="badge capo">${sugestao}</span>`;
                });
            } else {
                capoContainer.innerHTML = '<p style="font-size:14px; color:gray;">A IA não identificou sugestões de capotraste para esta música.</p>';
            }

            switchView('song');
        }
    </script>
</body>
</html>
