<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cifras Numbers - AI</title>
    <style>
        :root {
            --bg-color: #000000; --card-bg: #1c1c1e; --text-primary: #ffffff;
            --text-secondary: #ebebf599; --accent: #0a84ff; --border: #38383a;
            --bar-color: #545458; --rep-color: #ff9f0a; --danger: #ff3b30;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding-bottom: 80px; }
        
        header { background-color: rgba(28, 28, 30, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
        
        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { background-color: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
        
        .song-list-item { border-bottom: 1px solid var(--border); padding: 12px 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .song-list-item h3 { font-size: 17px; margin-bottom: 4px; font-weight: 500; }
        .song-list-item p { font-size: 14px; color: var(--text-secondary); }
        
        input, textarea { width: 100%; background-color: #2c2c2e; border: none; border-radius: 10px; padding: 12px 16px; color: var(--text-primary); font-size: 16px; margin-bottom: 16px; outline: none; }
        textarea { resize: vertical; min-height: 100px; }
        
        button { background-color: var(--accent); color: white; border: none; border-radius: 10px; padding: 14px; font-size: 17px; font-weight: 600; width: 100%; cursor: pointer; margin-bottom: 10px;}
        button:disabled { opacity: 0.5; }
        
        .btn-small { padding: 8px 12px; font-size: 13px; border-radius: 8px; width: auto; display: inline-block; margin-bottom:0;}
        .btn-edit { background-color: #333; }
        .btn-delete { background-color: var(--danger); }
        .btn-add-section { background-color: transparent; border: 1px solid var(--accent); color: var(--accent); }
        
        .section-title { font-size: 13px; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; margin-bottom: 8px; margin-top: 20px; letter-spacing: 0.5px; }
        .input-label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }
        
        /* Edit Section Block */
        .edit-section-block { background-color: #242426; border: 1px solid var(--border); padding: 12px; border-radius: 10px; margin-bottom: 16px; }
        
        .song-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .song-header h2 { font-size: 28px; margin-bottom: 4px; }
        .song-header p { color: var(--text-secondary); margin-bottom: 16px; }
        .song-actions { display: flex; gap: 8px; flex-direction: column; }
        
        .cifra-section { margin-bottom: 24px; }
        .cifra-section h4 { color: var(--text-primary); margin-bottom: 8px; font-size: 16px; font-weight: 600; }
        .cifra-chords { font-family: "Courier New", Courier, monospace; font-size: 18px; line-height: 1.8; letter-spacing: 1.5px; color: var(--accent); font-weight: 700; white-space: pre-wrap; }
        
        .cifra-bar { color: var(--bar-color); font-weight: 400; margin: 0 2px; }
        .cifra-rep { color: var(--rep-color); font-weight: 600; font-size: 15px; margin-left: 6px;}
        .badge { display: inline-block; background-color: #2c2c2e; padding: 6px 12px; border-radius: 12px; font-size: 13px; margin-right: 8px; margin-bottom: 8px; }
        .badge.capo { background-color: rgba(10, 132, 255, 0.2); color: var(--accent); display: block; width: fit-content;}
        
        nav { position: fixed; bottom: 0; width: 100%; background-color: rgba(28, 28, 30, 0.9); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; padding: 12px 0 20px 0; }
        nav div { color: var(--text-secondary); font-size: 12px; text-align: center; width: 50%; cursor: pointer; }
        nav div.active { color: var(--accent); }
        nav div svg { display: block; margin: 0 auto 4px auto; width: 24px; height: 24px; fill: currentColor; }
        .hidden { display: none !important; }
        .loading { text-align: center; color: var(--text-secondary); padding: 40px; }
    </style>
</head>
<body>

    <header>
        <h1 id="header-title">Minhas Cifras</h1>
        <div id="btn-back" class="hidden" style="color: var(--accent); cursor: pointer; font-size: 16px;">Voltar</div>
    </header>

    <main id="view-list" class="container">
        <div id="loading-list" class="loading">Carregando músicas...</div>
        <div class="card hidden" id="song-list-container"></div>
    </main>

    <main id="view-add" class="container hidden">
        <div class="section-title">Nova Cifra</div>
        <div class="card">
            <textarea id="input-cifra" placeholder="Cole aqui o texto da cifra..."></textarea>
            <button id="btn-salvar" onclick="saveCifra()">Processar com IA</button>
        </div>
    </main>

    <!-- TELA DE EDIÇÃO VISUAL -->
    <main id="view-edit" class="container hidden">
        <div class="section-title">Informações Básicas</div>
        <div class="card">
            <label class="input-label">Título</label>
            <input type="text" id="edit-title">
            <label class="input-label">Artista</label>
            <input type="text" id="edit-artist">
            <div style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label class="input-label">Tom</label>
                    <input type="text" id="edit-key">
                </div>
                <div style="flex:1;">
                    <label class="input-label">Ritmo</label>
                    <input type="text" id="edit-rhythm">
                </div>
            </div>
            <label class="input-label">Sugestões de Capo (Uma por linha)</label>
            <textarea id="edit-capo" placeholder="Ex: Tocar em G (Capo na 2)"></textarea>
        </div>

        <div class="section-title">Estrutura da Cifra</div>
        <div id="edit-sections-wrapper"></div>
        <button class="btn-add-section" onclick="addEmptySection()">+ Adicionar Nova Seção</button>

        <div style="margin-top: 30px;">
            <button id="btn-salvar-edicao" onclick="saveEdit()">Salvar Alterações</button>
        </div>
    </main>

    <main id="view-song" class="container hidden">
        <div class="song-header">
            <div>
                <h2 id="sv-title">Título</h2>
                <p id="sv-artist">Artista</p>
            </div>
            <div class="song-actions">
                <button class="btn-small btn-edit" onclick="openEditView()">Editar</button>
                <button class="btn-small btn-delete" id="btn-excluir-tela" onclick="deleteCurrentSong()">Excluir</button>
            </div>
        </div>
        <div style="margin-bottom: 24px;">
            <span class="badge" id="sv-key">Tom: E</span>
            <span class="badge" id="sv-rhythm">Ritmo: 4/4</span>
        </div>
        <div class="section-title">Tons e Capotraste</div>
        <div class="card" id="sv-capo-suggestions"></div>
        <div class="section-title">Roadmap Numérico</div>
        <div class="card" id="sv-cifra-body"></div>
    </main>

    <nav>
        <div id="nav-list" class="active" onclick="switchView('list')"><svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg> Biblioteca</div>
        <div id="nav-add" onclick="switchView('add')"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> Adicionar</div>
    </nav>

    <script>
        // === ATUALIZE PARA O SEU NOVO LINK DE DEPLOY AQUI ===
        const API_URL = 'https://script.google.com/macros/s/AKfycbzcvekR4cwaP3FsqkTA3RGguWlZ_Ks8fECJZfT7-XNgDv-kCW4Hallb9IuJiAwZOSgx/exec';

        let songsDatabase = [];
        let currentSongData = null;

        window.onload = fetchSongs;

        function switchView(view) {
            ['list', 'add', 'song', 'edit'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden'));
            document.getElementById('btn-back').classList.add('hidden');
            document.getElementById('nav-list').classList.remove('active');
            document.getElementById('nav-add').classList.remove('active');

            if(view === 'list') {
                document.getElementById('view-list').classList.remove('hidden');
                document.getElementById('nav-list').classList.add('active');
                document.getElementById('header-title').innerText = 'Minhas Cifras';
                if(songsDatabase.length === 0) fetchSongs();
            } else if(view === 'add') {
                document.getElementById('view-add').classList.remove('hidden');
                document.getElementById('nav-add').classList.add('active');
                document.getElementById('header-title').innerText = 'Nova Cifra';
            } else if(view === 'song') {
                document.getElementById('view-song').classList.remove('hidden');
                document.getElementById('btn-back').classList.remove('hidden');
                document.getElementById('btn-back').onclick = () => switchView('list');
                document.getElementById('header-title').innerText = 'Cifra';
            } else if(view === 'edit') {
                document.getElementById('view-edit').classList.remove('hidden');
                document.getElementById('btn-back').classList.remove('hidden');
                document.getElementById('btn-back').onclick = () => openSong(currentSongData); 
                document.getElementById('header-title').innerText = 'Editar Cifra';
            }
        }

        async function fetchSongs() {
            try {
                const res = await fetch(API_URL);
                songsDatabase = await res.json();
                renderList();
            } catch (error) {
                document.getElementById('loading-list').innerText = "Erro ao carregar dados.";
            }
        }

        // FETCH POSTS AGORA POSSUEM HEADER 'Content-Type' PARA NÃO CONGELAR!
        async function sendPostRequest(payload) {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            return await res.json();
        }

        async function saveCifra() {
            const rawText = document.getElementById('input-cifra').value;
            if(!rawText) return;
            const btn = document.getElementById('btn-salvar');
            btn.innerText = 'Processando...'; btn.disabled = true;

            try {
                const result = await sendPostRequest({ action: 'create', raw: rawText });
                if(result.success) {
                    document.getElementById('input-cifra').value = '';
                    await fetchSongs(); switchView('list');
                } else alert(result.error);
            } finally { btn.innerText = 'Processar com IA'; btn.disabled = false; }
        }

        function renderList() {
            const container = document.getElementById('song-list-container');
            document.getElementById('loading-list').classList.add('hidden');
            container.classList.remove('hidden');
            container.innerHTML = songsDatabase.length ? '' : '<p style="text-align:center; color:gray;">Nenhuma música.</p>';

            [...songsDatabase].reverse().forEach(song => {
                const div = document.createElement('div');
                div.className = 'song-list-item';
                div.innerHTML = `<div><h3>${song.Title}</h3><p>${song.Artist}</p></div><div style="color: var(--accent); font-weight: bold;">${song.Key}</div>`;
                div.onclick = () => openSong(song);
                container.appendChild(div);
            });
        }

        function openSong(song) {
            currentSongData = song;
            document.getElementById('sv-title').innerText = `• ${song.Title}`;
            document.getElementById('sv-artist').innerText = song.Artist;
            document.getElementById('sv-key').innerText = `Tom: ${song.Key}`;
            document.getElementById('sv-rhythm').innerText = `Ritmo: ${song.Rhythm || '4/4'}`;

            const body = document.getElementById('sv-cifra-body');
            body.innerHTML = '';
            (song.SectionsJSON || []).forEach(sec => {
                let htmlChords = sec.chords.join('<br>').replace(/\|/g, '<span class="cifra-bar">|</span>').replace(/ - /g, ' <span class="cifra-bar">-</span> ').replace(/\(\d+x\)/gi, '<span class="cifra-rep">$&</span>');
                body.innerHTML += `<div class="cifra-section"><h4>${sec.name} ${sec.lyric ? `<span style="color:gray;font-size:14px;">(${sec.lyric})</span>` : ''}</h4><div class="cifra-chords">${htmlChords}</div></div>`;
            });

            const capoCont = document.getElementById('sv-capo-suggestions');
            capoCont.innerHTML = (song.CapoJSON && song.CapoJSON.length) 
                ? song.CapoJSON.map(c => `<span class="badge capo">${c}</span>`).join('') 
                : '<p style="font-size:14px; color:gray;">Nenhuma sugestão registrada.</p>';
            switchView('song');
        }

        // === LÓGICA DE EDIÇÃO VISUAL ===
        
        function openEditView() {
            document.getElementById('edit-title').value = currentSongData.Title || '';
            document.getElementById('edit-artist').value = currentSongData.Artist || '';
            document.getElementById('edit-key').value = currentSongData.Key || '';
            document.getElementById('edit-rhythm').value = currentSongData.Rhythm || '';
            document.getElementById('edit-capo').value = (currentSongData.CapoJSON || []).join('\n');
            
            const wrapper = document.getElementById('edit-sections-wrapper');
            wrapper.innerHTML = '';
            (currentSongData.SectionsJSON || []).forEach((sec, idx) => appendSectionUI(sec.name, sec.lyric, sec.chords));
            switchView('edit');
        }

        function appendSectionUI(name = '', lyric = '', chords = []) {
            const wrapper = document.getElementById('edit-sections-wrapper');
            const div = document.createElement('div');
            div.className = 'edit-section-block';
            div.innerHTML = `
                <input type="text" class="inp-sec-name" placeholder="Nome (Ex: Refrão)" value="${name}">
                <input type="text" class="inp-sec-lyric" placeholder="Dica de Letra (Opcional)" value="${lyric}">
                <textarea class="inp-sec-chords" placeholder="Acordes (Um compasso por linha)">${chords.join('\n')}</textarea>
                <button class="btn-small btn-delete" onclick="this.parentElement.remove()">Remover Seção</button>
            `;
            wrapper.appendChild(div);
        }

        function addEmptySection() { appendSectionUI(); }

        async function saveEdit() {
            const btn = document.getElementById('btn-salvar-edicao');
            btn.innerText = 'Salvando...'; btn.disabled = true;

            const capoArray = document.getElementById('edit-capo').value.split('\n').filter(c => c.trim());
            const sectionsArray = [];
            document.querySelectorAll('.edit-section-block').forEach(block => {
                sectionsArray.push({
                    name: block.querySelector('.inp-sec-name').value,
                    lyric: block.querySelector('.inp-sec-lyric').value,
                    chords: block.querySelector('.inp-sec-chords').value.split('\n').filter(c => c.trim())
                });
            });

            try {
                const payload = {
                    action: 'update', id: currentSongData.id,
                    song: {
                        title: document.getElementById('edit-title').value, artist: document.getElementById('edit-artist').value,
                        key: document.getElementById('edit-key').value, rhythm: document.getElementById('edit-rhythm').value,
                        capo_suggestions: capoArray, sections: sectionsArray
                    }
                };
                
                const res = await sendPostRequest(payload);
                if(res.success) {
                    await fetchSongs();
                    const updated = songsDatabase.find(s => s.id === currentSongData.id);
                    openSong(updated);
                } else alert('Erro: ' + res.error);
            } finally { btn.innerText = 'Salvar Alterações'; btn.disabled = false; }
        }

        async function deleteCurrentSong() {
            if(!confirm('Deseja mesmo excluir esta cifra?')) return;
            const btn = document.getElementById('btn-excluir-tela');
            btn.innerText = "Excluindo...";
            try {
                const res = await sendPostRequest({ action: 'delete', id: currentSongData.id });
                if(res.success) { await fetchSongs(); switchView('list'); } 
                else { alert('Erro: ' + res.error); btn.innerText = "Excluir"; }
            } catch(e) { alert('Erro de conexão.'); btn.innerText = "Excluir"; }
        }
    </script>
</body>
</html>
