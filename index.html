<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cifras Numbers - iOS Dark</title>
    <style>
        /* === iOS DARK MODE CSS === */
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #ebebf599;
            --accent: #0a84ff;
            --accent-hover: #007aff;
            --border: #38383a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
        
        body { background-color: var(--bg-color); color: var(--text-primary); padding-bottom: 80px; }
        
        header { background-color: rgba(28, 28, 30, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
        
        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        
        .card { background-color: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        .song-list-item { border-bottom: 1px solid var(--border); padding: 12px 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .song-list-item:last-child { border-bottom: none; }
        .song-list-item h3 { font-size: 17px; margin-bottom: 4px; font-weight: 500; }
        .song-list-item p { font-size: 14px; color: var(--text-secondary); }
        
        input, textarea, select { width: 100%; background-color: #2c2c2e; border: none; border-radius: 10px; padding: 12px 16px; color: var(--text-primary); font-size: 16px; margin-bottom: 16px; outline: none; }
        textarea { resize: vertical; min-height: 200px; font-family: monospace; }
        
        button { background-color: var(--accent); color: white; border: none; border-radius: 10px; padding: 14px; font-size: 17px; font-weight: 600; width: 100%; cursor: pointer; transition: 0.2s; }
        button:active { background-color: var(--accent-hover); transform: scale(0.98); }
        button.secondary { background-color: #2c2c2e; color: var(--accent); margin-top: 10px; }
        
        .section-title { font-size: 13px; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; margin-bottom: 8px; margin-top: 20px; letter-spacing: 0.5px; }
        
        /* Song View Styles */
        .song-header h2 { font-size: 28px; margin-bottom: 4px; }
        .song-header p { color: var(--text-secondary); margin-bottom: 16px; }
        
        .cifra-section { margin-bottom: 20px; }
        .cifra-section h4 { color: var(--accent); margin-bottom: 6px; font-size: 15px; }
        .cifra-chords { font-family: monospace; font-size: 16px; line-height: 1.6; letter-spacing: 1px; }
        
        .badge { display: inline-block; background-color: #2c2c2e; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; margin-right: 8px; margin-bottom: 8px; }
        .badge.capo { background-color: rgba(10, 132, 255, 0.2); color: var(--accent); }
        .badge.medley { background-color: rgba(48, 209, 88, 0.2); color: #30d158; cursor: pointer; }
        
        /* Navigation Bar Bottom */
        nav { position: fixed; bottom: 0; width: 100%; background-color: rgba(28, 28, 30, 0.9); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0 20px 0; }
        nav div { color: var(--text-secondary); font-size: 12px; text-align: center; cursor: pointer; width: 50%; }
        nav div.active { color: var(--accent); }
        nav div svg { display: block; margin: 0 auto 4px auto; width: 24px; height: 24px; fill: currentColor; }

        .hidden { display: none !important; }
        .loading { text-align: center; color: var(--text-secondary); padding: 40px; }
    </style>
</head>
<body>

    <header>
        <h1 id="header-title">Minhas Cifras</h1>
        <div id="btn-back" class="hidden" style="color: var(--accent); cursor: pointer; font-size: 16px;">Voltar</div>
    </header>

    <!-- LISTA DE MÚSICAS -->
    <main id="view-list" class="container">
        <div id="loading-list" class="loading">Carregando músicas...</div>
        <div class="card hidden" id="song-list-container">
            <!-- Lista injetada via JS -->
        </div>
    </main>

    <!-- ADICIONAR MÚSICA -->
    <main id="view-add" class="container hidden">
        <div class="section-title">Adicionar Nova Cifra</div>
        <div class="card">
            <input type="text" id="input-rhythm" placeholder="Ritmo (ex: 4/4 Pop, Balada...)" value="4/4">
            <textarea id="input-cifra" placeholder="Cole aqui o texto completo do Cifra Club..."></textarea>
            <button onclick="saveCifra()">Salvar Cifra</button>
        </div>
    </main>

    <!-- VISUALIZAR MÚSICA -->
    <main id="view-song" class="container hidden">
        <div class="song-header">
            <h2 id="sv-title">Título</h2>
            <p id="sv-artist">Artista</p>
            <div>
                <span class="badge" id="sv-key">Tom: E</span>
                <span class="badge" id="sv-rhythm">Ritmo: 4/4</span>
            </div>
        </div>

        <div class="section-title">Sugestões de Tom / Capotraste</div>
        <div class="card" id="sv-capo-suggestions">
            <!-- Injetado via JS -->
        </div>

        <div class="section-title">Sugestões de Medley (Mesmo tom/harmonia)</div>
        <div class="card" id="sv-medley-suggestions">
            <!-- Injetado via JS -->
        </div>

        <div class="section-title">Cifra (Numbers)</div>
        <div class="card" id="sv-cifra-body">
            <!-- Injetado via JS -->
        </div>
    </main>

    <nav>
        <div id="nav-list" class="active" onclick="switchView('list')">
            <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            Biblioteca
        </div>
        <div id="nav-add" onclick="switchView('add')">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Adicionar
        </div>
    </nav>

    <script>
        // === CONFIGURAÇÃO API ===
        // COLE A URL DO SEU GOOGLE APPS SCRIPT AQUI:
        const API_URL = 'https://script.google.com/macros/s/AKfycbyl4Y3bFS49f0LJrQmEl6_xiugLGvjqpsx-aHdcogINb9SvGLSFnl13ShKWMXulfK4/exec';

        let songsDatabase = [];
        const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const flatToSharp = { 'Db':'C#', 'Eb':'D#', 'Gb':'F#', 'Ab':'G#', 'Bb':'A#' };

        // === INICIALIZAÇÃO ===
        window.onload = () => {
            fetchSongs();
        };

        // === NAVEGAÇÃO ===
        function switchView(view) {
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-add').classList.add('hidden');
            document.getElementById('view-song').classList.add('hidden');
            document.getElementById('btn-back').classList.add('hidden');
            
            document.getElementById('nav-list').classList.remove('active');
            document.getElementById('nav-add').classList.remove('active');

            if(view === 'list') {
                document.getElementById('view-list').classList.remove('hidden');
                document.getElementById('nav-list').classList.add('active');
                document.getElementById('header-title').innerText = 'Minhas Cifras';
                if(songsDatabase.length === 0) fetchSongs();
            } else if(view === 'add') {
                document.getElementById('view-add').classList.remove('hidden');
                document.getElementById('nav-add').classList.add('active');
                document.getElementById('header-title').innerText = 'Nova Cifra';
            } else if(view === 'song') {
                document.getElementById('view-song').classList.remove('hidden');
                document.getElementById('btn-back').classList.remove('hidden');
                document.getElementById('header-title').innerText = 'Cifra';
            }
        }

        document.getElementById('btn-back').onclick = () => switchView('list');

        // === API CALLS ===
        async function fetchSongs() {
            try {
                const response = await fetch(API_URL);
                songsDatabase = await response.json();
                renderList();
            } catch (error) {
                console.error("Erro ao carregar", error);
                document.getElementById('loading-list').innerText = "Erro ao carregar dados.";
            }
        }

        async function saveCifra() {
            const rawText = document.getElementById('input-cifra').value;
            const rhythm = document.getElementById('input-rhythm').value;
            
            if(!rawText) return alert('Cole a cifra primeiro!');
            
            const parsedData = parseCifraClubText(rawText);
            parsedData.rhythm = rhythm;

            const btn = document.querySelector('#view-add button');
            btn.innerText = 'Salvando...';
            btn.disabled = true;

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(parsedData)
                });
                alert('Música salva com sucesso!');
                document.getElementById('input-cifra').value = '';
                await fetchSongs();
                switchView('list');
            } catch (e) {
                alert('Erro ao salvar. Verifique o console.');
                console.error(e);
            } finally {
                btn.innerText = 'Salvar Cifra';
                btn.disabled = false;
            }
        }

        // === RENDERIZAÇÃO ===
        function renderList() {
            const container = document.getElementById('song-list-container');
            const loading = document.getElementById('loading-list');
            
            loading.classList.add('hidden');
            container.classList.remove('hidden');
            container.innerHTML = '';

            if(songsDatabase.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:gray;">Nenhuma música salva ainda.</p>';
                return;
            }

            songsDatabase.forEach(song => {
                const div = document.createElement('div');
                div.className = 'song-list-item';
                div.innerHTML = `
                    <div>
                        <h3>${song.Title}</h3>
                        <p>${song.Artist}</p>
                    </div>
                    <div style="color: var(--accent); font-weight: bold;">${song.Key}</div>
                `;
                div.onclick = () => openSong(song);
                container.appendChild(div);
            });
        }

        function openSong(song) {
            document.getElementById('sv-title').innerText = song.Title;
            document.getElementById('sv-artist').innerText = song.Artist;
            document.getElementById('sv-key').innerText = `Tom: ${song.Key}`;
            document.getElementById('sv-rhythm').innerText = `Ritmo: ${song.Rhythm}`;

            // Renderizar Cifra Numbers
            const body = document.getElementById('sv-cifra-body');
            body.innerHTML = '';
            song.SectionsJSON.forEach(section => {
                const div = document.createElement('div');
                div.className = 'cifra-section';
                div.innerHTML = `<h4>${section.name}</h4><div class="cifra-chords">${section.chords.join('<br>')}</div>`;
                body.appendChild(div);
            });

            // Gerar Capos
            generateCapoSuggestions(song.Key);

            // Gerar Medleys
            generateMedleys(song);

            switchView('song');
        }

        function generateCapoSuggestions(originalKey) {
            const container = document.getElementById('sv-capo-suggestions');
            container.innerHTML = '';
            
            let baseKey = originalKey.replace('m', ''); // simplificação
            baseKey = flatToSharp[baseKey] || baseKey;
            let targetKeyIndex = notes.indexOf(baseKey);
            
            if(targetKeyIndex === -1) return;

            // Shapes comuns no violão: C, D, E, G, A
            const shapes = ['C', 'D', 'G', 'A'];
            shapes.forEach(shape => {
                let shapeIdx = notes.indexOf(shape);
                let diff = targetKeyIndex - shapeIdx;
                if(diff < 0) diff += 12;
                
                if(diff > 0 && diff <= 7) { // Capo de 1 a 7
                    container.innerHTML += `<span class="badge capo">Tocar em ${shape} (Capo ${diff})</span>`;
                }
            });
            if(container.innerHTML === '') container.innerHTML = '<p style="font-size:14px; color:gray;">Capotraste não recomendado para este tom.</p>';
        }

        function generateMedleys(currentSong) {
            const container = document.getElementById('sv-medley-suggestions');
            container.innerHTML = '';
            
            let currentBase = currentSong.Key.replace('m', '');
            
            let medleys = songsDatabase.filter(s => 
                s.ID !== currentSong.ID && 
                (s.Key === currentSong.Key || s.Key.replace('m','') === currentBase)
            );

            if(medleys.length === 0) {
                container.innerHTML = '<p style="font-size:14px; color:gray;">Nenhum medley encontrado neste tom no seu banco.</p>';
                return;
            }

            medleys.forEach(m => {
                const span = document.createElement('span');
                span.className = 'badge medley';
                span.innerText = `${m.Title} (${m.Artist})`;
                span.onclick = () => openSong(m);
                container.appendChild(span);
            });
        }

        // === MOTOR DE PARSING (CIFRA -> NÚMEROS) ===
        function getDegree(chord, key) {
            let cleanKey = flatToSharp[key.replace('m','')] || key.replace('m','');
            let cleanChordBase = chord.match(/^[A-G][#b]?/)[0];
            cleanChordBase = flatToSharp[cleanChordBase] || cleanChordBase;

            let keyIdx = notes.indexOf(cleanKey);
            let chordIdx = notes.indexOf(cleanChordBase);
            
            if(keyIdx === -1 || chordIdx === -1) return chord;

            let diff = (chordIdx - keyIdx + 12) % 12;
            
            // Mapeamento escala maior: 0->1, 2->2, 4->3, 5->4, 7->5, 9->6, 11->7
            const intervals = {0:'1', 2:'2', 4:'3', 5:'4', 7:'5', 9:'6', 11:'7'};
            let degree = intervals[diff] || '?';

            // Adiciona sufixo menor se existir no acorde original
            if(chord.includes('m') && !chord.includes('maj')) degree += 'm';
            
            // Mantém baixos invertidos (ex: C/E -> 1/3) se quiser, mas para simplificar:
            return degree;
        }

        function parseCifraClubText(text) {
            const lines = text.split('\n');
            let title = lines[0] ? lines[0].trim() : 'Sem Título';
            let artist = lines[1] ? lines[1].replace('Composição de:', '').trim() : 'Desconhecido';
            
            let keyMatch = text.match(/Tom:\s*([A-G][#b]?m?)/i);
            let originalKey = keyMatch ? keyMatch[1] : 'C';

            let sections = [];
            let currentSectionName = 'Intro';
            let currentChords = [];

            // Expressão regular básica para detectar linhas que são SÓ de acordes (sem letras)
            const chordLineRegex = /^[\sA-G#b0-9m\/()]+$/;

            for(let i = 0; i < lines.length; i++) {
                let line = lines[i].replace(/\r/g, '').trimRight();
                let trimmed = line.trim();

                if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
                    if(currentChords.length > 0) {
                        sections.push({ name: currentSectionName, chords: [...currentChords] });
                        currentChords = [];
                    }
                    currentSectionName = trimmed.replace(/[\[\]]/g, '');
                } 
                else if (trimmed.length > 0 && chordLineRegex.test(trimmed) && !trimmed.toLowerCase().includes('tom:')) {
                    // Pega os acordes separados por espaço
                    let chordsInLine = trimmed.split(/\s+/).filter(c => c.length > 0);
                    if(chordsInLine.length > 0) {
                        let numberedLine = chordsInLine.map(c => getDegree(c, originalKey)).join(' — ');
                        currentChords.push(numberedLine);
                    }
                }
            }
            if(currentChords.length > 0) {
                sections.push({ name: currentSectionName, chords: [...currentChords] });
            }

            return { title, artist, key: originalKey, sections, raw: text };
        }
    </script>
</body>
</html>
